<!DOCTYPE html>
<html>
<head>
<title>P6 — API Keys Setup</title>

<style>
body{background:#0a0a0f;color:#e5e7eb;font-family:Arial;margin:0;}
.container{max-width:900px;margin:auto;padding:30px;}
.box{background:#12121a;padding:18px;border-radius:12px;margin-top:15px;}
pre{background:#111827;padding:12px;border-radius:10px;}
h1{color:#38bdf8;} h2{color:#34d399;}
</style>
</head>

<body>

<div class="container">
<h1>P6 — API Key Setup</h1>

<div class="box">
<h2>Set Key</h2>

<pre>
export OPENAI_API_KEY="your_key_here"
</pre>

</div>

<div class="box">
<h2>Validate</h2>

<pre>
echo $OPENAI_API_KEY
</pre>

✔ Should print your key

</div>

</div>
</body>
</html>
